name: Build Cloudflare DEV Candidate

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-dev-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Existing code-quality audit (non-blocking baseline)
        continue-on-error: true
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build DEV candidate
        env:
          VITE_APP_ENV: development
        run: npm run build:dev
      - name: Record build output
        run: find . -maxdepth 3 -type d \( -name dist -o -name client -o -name server -o -name output \) -print | sort
